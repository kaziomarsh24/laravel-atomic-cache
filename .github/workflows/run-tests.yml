name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        include:
          - laravel: '10.*'
            testbench: '^8.0'
          - laravel: '11.*'
            testbench: '^9.0'
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
        exclude:
          - php: '8.4'
            laravel: '10.*'
          - php: '8.5'
            laravel: '10.*'
          - php: '8.5'
            laravel: '11.*'
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} - L${{ matrix.laravel }}

    services:
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      COMPOSER_POLICY_ADVISORIES_BLOCK: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zlib, pdo, sqlite, pdo_sqlite, redis
          coverage: none

      - name: Install dependencies
        run: |
          composer config --global policy.advisories.block false 2>/dev/null || true
          composer config policy.advisories.block false 2>/dev/null || true
          composer require "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --no-audit

      - name: Execute tests
        run: ./vendor/bin/phpunit
