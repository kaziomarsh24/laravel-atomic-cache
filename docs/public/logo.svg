<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="acGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="#0b0f17" stroke="#1e293b" stroke-width="2.5" />

  <!-- Center Nucleus Glow -->
  <circle cx="50" cy="50" r="10" fill="url(#acGrad)" />
  <circle cx="50" cy="50" r="14" fill="#06b6d4" fill-opacity="0.15" />

  <!-- Orbital Ellipse 1 (Horizontal) -->
  <ellipse cx="50" cy="50" rx="34" ry="14" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="4 2" />

  <!-- Orbital Ellipse 2 (Rotated 60deg) -->
  <ellipse cx="50" cy="50" rx="34" ry="14" stroke="url(#orbitGrad)" stroke-width="2.5" transform="rotate(60 50 50)" />

  <!-- Orbital Ellipse 3 (Rotated -60deg) -->
  <ellipse cx="50" cy="50" rx="34" ry="14" stroke="url(#orbitGrad)" stroke-width="2.5" transform="rotate(-60 50 50)" />

  <!-- Orbiting Electron Particles -->
  <circle cx="84" cy="50" r="3" fill="#38bdf8" />
  <circle cx="33" cy="21" r="3" fill="#06b6d4" />
  <circle cx="67" cy="79" r="3" fill="#38bdf8" />
</svg>
